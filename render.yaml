databases:
  - name: trip-app-doko-itta-db
    databaseName: trip_app_doko_itta
    user: trip_app_doko_itta

services:
  - type: web
    name: trip-app-doko-itta
    runtime: ruby
    buildCommand: "./bin/render-build.sh"
    startCommand: "bundle exec puma -C config/puma.rb"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trip-app-doko-itta-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
